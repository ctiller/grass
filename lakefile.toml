# Grass build configuration.
#
# The toolchain is pinned by `lean-toolchain` to the baseline in
# docs/MODULES.md. Dependencies are deliberately empty: docs/FOUNDATION.md
# requires every selected dependency to enter the TCB and build ledgers, so a
# dependency is added by a reviewed change, never as a convenience.

name = "grass"
defaultTargets = ["Grass", "Tests"]

# `warningAsError` is the build gate, not a style preference. Without it a
# declaration using `sorry` is a warning and `lake build` exits 0, which would
# make a green build carry no information about docs/FOUNDATION.md section 3.
[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

# `Grass.+` builds the root module and every submodule, so a new file under
# `Grass/` is checked without an umbrella module importing it. An umbrella that
# imported every leaf would violate the aggregate rules in
# docs/OLEAN_SHARDING.md.

[[lean_lib]]
name = "Grass"
globs = ["Grass.+"]

# Fixtures live outside the library and are built by the default target, so a
# vocabulary change that breaks the Spike 1 reference cases fails the build
# rather than being noticed later. See docs/MEMORY_IMPLEMENTATION_PLAN.md
# section 3.2.
[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]
