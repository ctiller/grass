[package]
name = "agent-bus"
version = "0.1.0"
edition = "2021"
description = "Helper for the Grass agent-bus cross-provider coordination protocol"

[[bin]]
name = "agent-bus"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
regex = "1"
unicode-normalization = "0.1"
fs4 = { version = "0.8", features = ["sync"] }
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "redactions"] }
