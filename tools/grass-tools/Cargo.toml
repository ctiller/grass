[package]
name = "grass-tools"
version = "0.1.0"
edition = "2021"
description = "Grass validation and audit tools: docstring and source audits, differential checks against independent assemblers and disassemblers, and machine probes"

# Each tool is a self-contained binary with no shared library. The scripts these
# replace were self-contained too, and each is invoked independently by
# `.github/workflows/library.yml`; keeping them separate means a change to one
# cannot silently alter another's verdict.
#
# `docstring-audit` still needs Lean, because the set of names the build knows
# has no reading outside the environment. It generates the meta-program it needs
# into a temporary file, elaborates it with `lake env lean`, and does the judging
# here. That is what retires the checked-in Lean file it used to shell out to.
#
# This crate is where the remaining validation tools land as they are ported and
# their equivalence against the originals is demonstrated. A `[[bin]]` entry is
# a claim that the equivalence has been shown, so an entry appears only once
# something has shown it.
#
# For the four x86 tools that is `equivalence/run.sh`, which runs each Python
# original and its port over identical argv and byte-compares stdout, stderr and
# the exit status: over the real generated corpus, over eight corpora carrying
# one injected defect each -- so the comparison is known to be able to fail --
# and over the case where the oracle is absent, which both must refuse rather
# than pass over.
#
# This paragraph previously said neither assembler could be run here, and that
# the four were therefore ported and unlanded with no differential against the
# original. That was wrong. NASM and NDISASM are installed on the authoring host
# at `~/AppData/Local/bin/NASM`, which is one of the fixed fallback directories
# all four of these tools search after PATH -- they are missing from PATH, not
# from the machine, so `shutil.which` and `command -v` miss them while the
# tools' own lookup finds them.
#
# `win64-unwind-differential` and `source-liveness` were the first two whose
# oracles were run: `ml64.exe` ships with the MSVC build tools, and a probe
# against an HTTP server is a probe whether the server is a publisher or a
# loopback socket.

[[bin]]
name = "docstring-audit"
path = "src/bin/docstring_audit.rs"

[[bin]]
name = "source-liveness"
path = "src/bin/source_liveness.rs"

[[bin]]
name = "win64-unwind-differential"
path = "src/bin/win64_unwind_differential.rs"

[[bin]]
name = "x86-nasm-differential"
path = "src/bin/x86_nasm_differential.rs"

[[bin]]
name = "x86-ndisasm-differential"
path = "src/bin/x86_ndisasm_differential.rs"

[[bin]]
name = "x86-decode-differential"
path = "src/bin/x86_decode_differential.rs"

[[bin]]
name = "x86-machine-probe"
path = "src/bin/x86_machine_probe.rs"

[dependencies]
regex = "1"
tempfile = "3"

[profile.release]
debug = false
