[package]
name = "grass-tools"
version = "0.1.0"
edition = "2021"
description = "Grass validation and audit tools: source and docstring audits over the Lean tree"

# Each tool is a self-contained binary with no shared library. The scripts these
# replace were self-contained too, and each is invoked independently by
# `.github/workflows/library.yml`; keeping them separate means a change to one
# cannot silently alter another's verdict.
#
# `docstring-audit` still needs Lean, because the set of names the build knows
# has no reading outside the environment. It generates the meta-program it needs
# into a temporary file, elaborates it with `lake env lean`, and does the judging
# here. That is what retires the checked-in Lean file it used to shell out to.
#
# `trust-audit` needs Lean for the same reason, and for a second one: two thirds
# of it is ten adversarial probes that each construct a way to smuggle an
# unverified artefact past `Grass/Trust/Audit.lean` and require the audit to
# notice. A probe is a Lean elaboration whose *failure* is the passing result, so
# this binary spends most of its time reading exit statuses it wants to be
# non-zero -- and must never let one of them become its own. See
# `src/bin/trust_audit.rs`.
#
# `doc-links` and `spike-sources` need nothing but the filesystem. They were
# PowerShell only because their author was on Windows, not because anything they
# check is. `doc-links` in particular is a `required_check` on review nominations
# (`docs/AGENT_REVIEW.md`), so a developer who cannot run it cannot check their
# own work before nominating it.
#
# This crate is where the remaining validation tools land as they are ported and
# their equivalence against the originals is demonstrated. It carries four
# binaries rather than a placeholder for ten, because a `[[bin]]` entry for a
# tool nobody has verified is a claim this file cannot back.

[[bin]]
name = "docstring-audit"
path = "src/bin/docstring_audit.rs"

[[bin]]
name = "trust-audit"
path = "src/bin/trust_audit.rs"

[[bin]]
name = "doc-links"
path = "src/bin/doc_links.rs"

[[bin]]
name = "spike-sources"
path = "src/bin/spike_sources.rs"

[dependencies]
regex = "1"
tempfile = "3"

[profile.release]
debug = false
