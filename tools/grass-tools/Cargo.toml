[package]
name = "grass-tools"
version = "0.1.0"
edition = "2021"
description = "Grass validation and audit tools: differential checks against independent assemblers and disassemblers, machine probes, and docstring audits over the Lean tree"

# Each tool is a self-contained binary with no shared library. The scripts these
# replace were self-contained too, and each is invoked independently by
# `.github/workflows/library.yml`; keeping them separate means a change to one
# cannot silently alter another's verdict.
#
# `docstring-audit` still needs Lean, because the set of names the build knows
# has no reading outside the environment. It generates the meta-program it needs
# into a temporary file, elaborates it with `lake env lean`, and does the judging
# here. That is what retires the checked-in Lean file it used to shell out to.
#
# This crate is where the remaining validation tools land as they are ported and
# their equivalence against the originals is demonstrated. A `[[bin]]` entry is
# a claim that the equivalence has been shown, so an entry appears only once
# something has shown it. For the four x86 tools below that something is
# `equivalence/run.sh`, which runs the Python original and the binary here over
# the same generated corpus and byte-compares stdout, stderr and the exit
# status. It covers the real corpus, eight corpora carrying one injected defect
# each -- so the comparison is known to be able to fail -- and the case where
# the oracle is absent, which both must refuse rather than pass over.

[[bin]]
name = "docstring-audit"
path = "src/bin/docstring_audit.rs"

[[bin]]
name = "x86-nasm-differential"
path = "src/bin/x86_nasm_differential.rs"

[[bin]]
name = "x86-ndisasm-differential"
path = "src/bin/x86_ndisasm_differential.rs"

[[bin]]
name = "x86-decode-differential"
path = "src/bin/x86_decode_differential.rs"

[[bin]]
name = "x86-machine-probe"
path = "src/bin/x86_machine_probe.rs"

[dependencies]
regex = "1"
tempfile = "3"

[profile.release]
debug = false
