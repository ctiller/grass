[package]
name = "grass-tools"
version = "0.1.0"
edition = "2021"
description = "Grass validation and audit tools: source and docstring audits over the Lean tree"

# Each tool is a self-contained binary with no shared library. The scripts these
# replace were self-contained too, and each is invoked independently by
# `.github/workflows/library.yml`; keeping them separate means a change to one
# cannot silently alter another's verdict.
#
# `docstring-audit` still needs Lean, because the set of names the build knows
# has no reading outside the environment. It generates the meta-program it needs
# into a temporary file, elaborates it with `lake env lean`, and does the judging
# here. That is what retires the checked-in Lean file it used to shell out to.
#
# `axiom-audit` is the same shape for the same reason: which axioms a proof rests
# on is the kernel's record of the term it checked, and no reading of the source
# text can recover it. It generates its meta-program, elaborates it, and applies
# docs/FOUNDATION.md section 3 to the facts that come back. The Lean file it
# replaces was not shelled out to -- it *was* the tool -- so retiring it also
# retires the hand-written import list of every module in the library, which is
# what made that file conflict with `main` on every rebase.
#
# This crate is where the remaining validation tools land as they are ported and
# their equivalence against the originals is demonstrated. It carries the two
# binaries whose equivalence has been demonstrated rather than a placeholder for
# nine, because a `[[bin]]` entry for a tool nobody has verified is a claim this
# file cannot back.

[[bin]]
name = "docstring-audit"
path = "src/bin/docstring_audit.rs"

[[bin]]
name = "axiom-audit"
path = "src/bin/axiom_audit.rs"

[dependencies]
regex = "1"
tempfile = "3"

[profile.release]
debug = false
