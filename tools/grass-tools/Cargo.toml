[package]
name = "grass-tools"
version = "0.1.0"
edition = "2021"
description = "Grass validation and audit tools: the docstring, trust, documentation-link, spike-source, observation-coverage and source-liveness audits, and the Win64 unwind differential"

# Each tool is a self-contained binary with no shared library. The scripts these
# replace were self-contained too, and each is invoked independently by
# `.github/workflows/library.yml`; keeping them separate means a change to one
# cannot silently alter another's verdict.
#
# `docstring-audit` and `coverage-audit` still need Lean, because what the build
# knows -- the set of declaration names, and every theorem's statement -- has no
# reading outside the environment. Each generates the meta-program it needs into
# a temporary file, elaborates it with `lake env lean`, and does the judging
# here. That is what retires the checked-in Lean files they replace.
#
# `trust-audit` needs Lean for the same reason, and for a second one: two thirds
# of it is ten adversarial probes that each construct a way to smuggle an
# unverified artefact past `Grass/Trust/Audit.lean` and require the audit to
# notice. A probe is a Lean elaboration whose *failure* is the passing result, so
# this binary spends most of its time reading exit statuses it wants to be
# non-zero -- and must never let one of them become its own. See
# `src/bin/trust_audit.rs`.
#
# `doc-links` and `spike-sources` need nothing but the filesystem. They were
# PowerShell only because their author was on Windows, not because anything they
# check is. `doc-links` in particular is a `required_check` on review nominations
# (`docs/AGENT_REVIEW.md`), so a developer who cannot run it cannot check their
# own work before nominating it.
#
# This crate is where the remaining validation tools land as they are ported and
# their equivalence against the originals is demonstrated. It carries seven
# binaries rather than a placeholder for nine, because a `[[bin]]` entry for a
# tool nobody has verified is a claim this file cannot back.
#
# The four x86 tools that shell out to NASM or NDISASM are deliberately not
# among them. They have been deleted, and restoring that verification is
# tracked against `c-x86`, which owns the domain.
#
# The reason is shape, not capability, and an earlier version of this comment
# said otherwise. It claimed neither assembler could be run here. That was
# wrong: NASM and NDISASM are installed, and the Python tools being replaced
# named the directory themselves, because the Windows installer deliberately
# leaves itself off PATH and `command -v` therefore misses it. The ports were in
# fact validated -- 24 of 24 cases byte-identical against the real oracle,
# including eight injected faults and four oracle-absent refusals.
#
# What is wrong with them is that a differential belongs beside the thing it
# checks. These corpora are already Lean, under `Tests/ISA/X86/**`; the checker
# was a separate program in a separate language wired in by a bespoke CI step,
# so it ran by a different mechanism from every other test and belonged to
# whoever owned the tooling tree rather than to x86. As Lean tests they run
# under `lake build` with everything else.
#
# The loss in the meantime is real and is recorded as one: the x86 differentials
# check something no Lean theorem can, because every theorem in
# `Grass/ISA/X86/**` relates Grass's own definitions to each other, so an
# encoder and decoder wrong in the same way satisfy all of them.

[[bin]]
name = "docstring-audit"
path = "src/bin/docstring_audit.rs"

[[bin]]
name = "trust-audit"
path = "src/bin/trust_audit.rs"

[[bin]]
name = "doc-links"
path = "src/bin/doc_links.rs"

[[bin]]
name = "spike-sources"
path = "src/bin/spike_sources.rs"

[[bin]]
name = "coverage-audit"
path = "src/bin/coverage_audit.rs"

[[bin]]
name = "source-liveness"
path = "src/bin/source_liveness.rs"

[[bin]]
name = "win64-unwind-differential"
path = "src/bin/win64_unwind_differential.rs"

[dependencies]
regex = "1"
tempfile = "3"

[profile.release]
debug = false
