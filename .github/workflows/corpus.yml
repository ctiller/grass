name: Corpus checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spike source views
        shell: pwsh
        run: ./check-spike-sources.ps1

      - name: Check local documentation links
        shell: pwsh
        run: ./check-doc-links.ps1
