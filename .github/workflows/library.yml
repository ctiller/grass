name: Library build

# The corpus workflow checks documents. This one checks the Lean library, which
# until now had no mechanical gate at all: `lake build` was never run in CI, so a
# declaration using `sorry` could reach main unnoticed.
#
# Two things make a green run mean something. `warningAsError = true` in
# lakefile.toml turns Lean's `declaration uses 'sorry'` warning into a build
# failure. The axiom audit then enforces docs/FOUNDATION.md section 3: only the
# reviewed logical-foundation constants are permitted, and `sorryAx` or any
# dependency-declared axiom fails the gate.
#
# A third check is about prose. Four adversarial review rounds each found a
# docstring asserting a property the code did not have, including one naming a
# theorem that did not exist. Tools/ConsultedAudit.py is a cheap net over a
# different recurring failure: a fact the model carries that nothing consults. It
# checks a lexical property -- that a declared field name is projected somewhere --
# which is weaker than "every field is read" and is not evidence that the class is
# closed; its own docstring lists what it cannot see. Run it with --self-test after
# changing the scanner. Tools/DocstringAudit.py requires a strong claim in
# a definition or module comment to name the type or theorem enforcing it.
# Tools/CitationAudit.py closes the gap those two leave: a docstring may name an
# enforcing theorem that no longer exists, and a debt may be "recorded in section
# 4.2" of a document whose section 4.2 is about something else. Three review rounds
# found both. It is lexical too -- it matches short names and cannot tell a
# still-resolving citation from an accurate one -- and its own docstring lists what
# it does not see.
#
# All four now self-test, and `DocstringAudit.py` was the last to. It was also the
# only one whose roots were relative to the working directory, so it printed its
# success line and exited 0 from anywhere but the repo root, having read nothing —
# the pure "check that cannot fail", in the tool that exists to catch that class.
# Review found it. Every audit here anchors on `__file__` and fails when it finds no
# sources.
#
# Tools/ReachabilityAudit.py is the fifth, over a class the others cannot see:
# `ConsultedAudit.py` scans structure fields, and this is about sum constructors. A
# constructor nothing builds makes every theorem about it hold of a term no state can
# reach — `AuthorityState` carried three such, and section 4.4.1 of the plan asked
# for this check in its own words. It is lexical too and reports ten deliberate
# entries into an allowlist rather than none.
#
# Tools/DoorAudit.py is the seventh, and it guards a rule that cannot be enforced
# inside the thing it protects. `MemoryState`'s grant map has five checked doors and
# four separate second ways in were found on this branch. `issue?` takes no acting
# context -- it reads the lender from the grant -- so "the acting context must be the
# lender it names" cannot live in the door: a caller holding the grant would satisfy
# an `actor` parameter by passing `grant.lender`, a gate closed with the thing being
# gated. The check has content only where the actor comes from somewhere the caller
# does not choose, which is the access descriptor's context, so it lives in
# `applyAuthorityDelta?` -- and this audit is what keeps every `Grass/` path going
# through there. `Tests/` is deliberately not scanned.
#
# Tools/FixtureAudit.py is the eighth, over the one place the field and constructor
# audits do not look: a `def` under Tests/ that nothing uses. `Tests/Memory/Loans.lean`
# carried a state built by reallocating under an outstanding loan from before that
# reallocation was refused -- after the refusal landed the definition still
# elaborated, its `.getD` silently returned the unreallocated state, and nothing used
# it, so nothing failed.
#
# Tools/SourceLocationAudit.py is the sixth, and it exists because of an accident
# rather than a class: two scratch probe files were swept into commits by a
# `git add -A`, one of them containing a `sorry`, and a repo-root `.lean` file is
# outside every gate there is — `lake build` globs `Grass.+` and `Tests.+`, and every
# audit above scans those two trees. Neither file ever failed anything.
#
# Tools/CoverageAudit.lean is the ninth, and it arrived from the standard library's
# side of the tree rather than this one -- renumbered here because a merge put both
# enumerations in one comment, and it was written as "a fourth check".
# docs/STDLIB_IMPLEMENTATION_PLAN.md decision 6
# requires every Vec-returning operation to carry a law computing its length and
# a law computing its get?. That rule was stated in prose three times and
# violated in the same commit that stated it each time - most recently by
# Vec.sum, on the right-hand side of a law consumers apply. lake build says
# nothing about it: an operation with no law compiles. Tools/CoverageAudit.lean
# is what says something.
#
# The x86 differentials check something no Lean theorem can. Every theorem in
# Grass/ISA/X86/** relates Grass's own definitions to each other, so an encoder
# and decoder that are wrong in the same way satisfy all of them while emitting
# instructions no processor executes -- a reviewer demonstrated exactly that
# with a consistent RIP-relative/absolute swap that closed every proof
# unchanged. NASM and NDISASM are the only things in the repository that can
# notice. They ran by hand until now, which meant the claim they support could
# rot with nothing to say so.
#
# The `unwind` job exists because that argument applies again, and the second
# time it was not hypothetical. Win64 `.xdata` is a Microsoft format, and
# Microsoft's assembler generates it from the same prologue Grass models, so
# ml64 is an oracle for it -- a better one than NASM is for encodings, being the
# vendor of the format rather than a third party. It disagreed on 32 of 50
# prologues the first time it ran, and both causes were Grass defects that no
# proof in the repository could see: CountOfCodes folded in the padding slot,
# and UWOP_SET_FPREG wrote 0 where ml64 writes the frame register. Of eight
# mutations tried against the model afterwards, four are caught only here and
# not by any theorem.
#
# It is a separate Windows job because ml64.exe is Windows-only. A missing
# assembler fails the job rather than skipping it: a differential that passes
# because its oracle is absent is worse than no differential.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: |
          lean --version
          lake --version

      - name: Build the library
        run: lake build

      - name: Audit axioms
        run: lake env lean Tools/AxiomAudit.lean

      - name: Audit verified-program trust closure
        shell: pwsh
        run: ./audit-trust.ps1

      - name: Self-test the docstring audit
        run: python3 Tools/DocstringAudit.py --self-test

      - name: Audit docstring claims
        run: python3 Tools/DocstringAudit.py

      - name: Self-test the consulted audit
        run: python3 Tools/ConsultedAudit.py --self-test

      - name: Audit declared field names never projected
        run: python3 Tools/ConsultedAudit.py

      - name: Self-test the source location audit
        run: python3 Tools/SourceLocationAudit.py --self-test

      - name: Audit Lean sources outside every gate
        run: python3 Tools/SourceLocationAudit.py

      - name: Self-test the reachability audit
        run: python3 Tools/ReachabilityAudit.py --self-test

      - name: Audit constructors nothing builds
        run: python3 Tools/ReachabilityAudit.py

      - name: Self-test the fixture audit
        run: python3 Tools/FixtureAudit.py --self-test

      - name: Audit fixtures nothing uses
        run: python3 Tools/FixtureAudit.py

      - name: Self-test the door audit
        run: python3 Tools/DoorAudit.py --self-test

      - name: Audit authority-map changes outside the map's own modules
        run: python3 Tools/DoorAudit.py

      - name: Self-test the citation audit
        run: python3 Tools/CitationAudit.py --self-test

      - name: Audit citations of declarations and document sections
        run: python3 Tools/CitationAudit.py

      - name: Report ledger coverage
        run: lake env lean Tests/ISA/X86/LedgerAudit.lean
      - name: Audit observation coverage
        run: lake env lean Tools/CoverageAudit.lean

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Differential against NASM
        run: |
          lake env lean --run Tests/ISA/X86/NasmCorpus.lean > "$RUNNER_TEMP/corpus.txt"
          python3 Tools/x86-nasm-differential.py "$RUNNER_TEMP/corpus.txt"

      - name: Differential against NDISASM
        run: |
          lake env lean --run Tests/ISA/X86/RipCorpus.lean > "$RUNNER_TEMP/rip.txt"
          python3 Tools/x86-ndisasm-differential.py "$RUNNER_TEMP/rip.txt"

      - name: Decoder differential against NDISASM
        run: |
          lake env lean --run Tests/ISA/X86/DecodeCorpus.lean > "$RUNNER_TEMP/decode.txt"
          python3 Tools/x86-decode-differential.py "$RUNNER_TEMP/decode.txt"
  unwind:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          curl -sSfL -o elan-init.exe https://github.com/leanprover/elan/releases/download/v4.2.3/elan-init-x86_64-pc-windows-msvc.exe
          ./elan-init.exe -y --default-toolchain none
          echo "$USERPROFILE/.elan/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: |
          lean --version
          lake --version

      - name: Build the unwind corpus
        run: lake build Tests.ABI.Win64.UnwindCorpus

      - name: Differential against ml64
        run: |
          lake env lean --run Tests/ABI/Win64/UnwindCorpus.lean > "$RUNNER_TEMP/unwind.txt"
          python Tools/win64-unwind-differential.py "$RUNNER_TEMP/unwind.txt"
