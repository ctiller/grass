name: Library build

# The corpus workflow checks documents. This one checks the Lean library, which
# until now had no mechanical gate at all: `lake build` was never run in CI, so a
# declaration using `sorry` could reach main unnoticed.
#
# Two things make a green run mean something. `warningAsError = true` in
# lakefile.toml turns Lean's `declaration uses 'sorry'` warning into a build
# failure. The axiom audit then enforces docs/FOUNDATION.md section 3: only the
# reviewed logical-foundation constants are permitted, and `sorryAx` or any
# dependency-declared axiom fails the gate.
#
# A third check is about prose. Four adversarial review rounds each found a
# docstring asserting a property the code did not have, including one naming a
# theorem that did not exist. Tools/ConsultedAudit.py is a cheap net over a
# different recurring failure: a fact the model carries that nothing consults. It
# checks a lexical property -- that a declared field name is projected somewhere --
# which is weaker than "every field is read" and is not evidence that the class is
# closed; its own docstring lists what it cannot see. Run it with --self-test after
# changing the scanner. Tools/DocstringAudit.py requires a strong claim in
# a definition or module comment to name the type or theorem enforcing it.
# Tools/CitationAudit.py closes the gap those two leave: a docstring may name an
# enforcing theorem that no longer exists, and a debt may be "recorded in section
# 4.2" of a document whose section 4.2 is about something else. Three review rounds
# found both. It is lexical too -- it matches short names and cannot tell a
# still-resolving citation from an accurate one -- and its own docstring lists what
# it does not see.
#
# All four now self-test, and `DocstringAudit.py` was the last to. It was also the
# only one whose roots were relative to the working directory, so it printed its
# success line and exited 0 from anywhere but the repo root, having read nothing —
# the pure "check that cannot fail", in the tool that exists to catch that class.
# Review found it. Every audit here anchors on `__file__` and fails when it finds no
# sources.
#
# Tools/ReachabilityAudit.py is the fifth, over a class the others cannot see:
# `ConsultedAudit.py` scans structure fields, and this is about sum constructors. A
# constructor nothing builds makes every theorem about it hold of a term no state can
# reach — `AuthorityState` carried three such, and section 4.4.1 of the plan asked
# for this check in its own words. It is lexical too and reports ten deliberate
# entries into an allowlist rather than none.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: |
          lean --version
          lake --version

      - name: Build the library
        run: lake build

      - name: Audit axioms
        run: lake env lean Tools/AxiomAudit.lean

      - name: Self-test the docstring audit
        run: python3 Tools/DocstringAudit.py --self-test

      - name: Audit docstring claims
        run: python3 Tools/DocstringAudit.py

      - name: Self-test the consulted audit
        run: python3 Tools/ConsultedAudit.py --self-test

      - name: Audit declared field names never projected
        run: python3 Tools/ConsultedAudit.py

      - name: Self-test the reachability audit
        run: python3 Tools/ReachabilityAudit.py --self-test

      - name: Audit constructors nothing builds
        run: python3 Tools/ReachabilityAudit.py

      - name: Self-test the citation audit
        run: python3 Tools/CitationAudit.py --self-test

      - name: Audit citations of declarations and document sections
        run: python3 Tools/CitationAudit.py
